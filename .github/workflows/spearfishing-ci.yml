name: Spearfishing checks
on:
  pull_request:
    paths: ['spearfishing/**', '.github/workflows/spearfishing-*.yml']
  push:
    branches: ['feature/marine-forecast-alerts']
    paths: ['spearfishing/**', '.github/workflows/spearfishing-*.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spearfishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec wrangler deploy --dry-run --outdir .worker-dist
        env:
          WRANGLER_SEND_METRICS: 'false'
      - run: python scripts/package-pages.py
